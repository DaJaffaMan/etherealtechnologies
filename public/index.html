    <meta property="og:description" content="Experts in software, consultants you can rely on. Ethereal Technologies provides top-tier software consultancy, cloud architecture, and full-stack engineering in Bristol, UK." />

    <!-- Preload critical assets for LCP -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/profile.jpeg" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- FOUC prevention script to set correct class on html load -->
    <script>
      {
        try {
          let theme = localStorage.getItem("theme");
          // Remove legacy 'light' override logic; allow dynamic resolution
          theme = theme || "system";
          
          if (theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      }
    </script>
    <link rel="manifest" href="manifest.json" />
